spring.application.name=encurtadorlink

spring.datasource.url=jdbc:mysql://localhost:3306/banco_links
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.forward-headers-strategy=framework

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.datasource.hikari.minimumIdle=2
spring.datasource.hikari.maximumPoolSize=8
spring.datasource.hikari.idleTimeout=15000
spring.datasource.hikari.maxLifetime=600000
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.poolName=EncurtadorLinkPool

jwt.issuer="encurtalink"
jwt.private.key=${JWT_PRIVATE_KEY_PATH:classpath:app.key}
jwt.public.key=${JWT_PUBLIC_KEY_PATH:classpath:app.pub}

logging.level.org.springframework.security=INFO